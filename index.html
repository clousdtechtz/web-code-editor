<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCraft IDE</title>
    <meta
      name="description"
      content="CodeCraft IDE is a browser-based coding workspace for Java, C++, Python, and more."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <div class="logo">C</div>
          <div>
            <div class="brand-name">CodeCraft</div>
            <div class="brand-sub">IDE</div>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="section-label">Explorer</div>
          <div id="project-tree" class="project-tree"></div>
        </div>

        <div class="sidebar-section tools-panel">
          <div class="section-label">Quick tools</div>
          <button class="tool-btn" id="new-file-btn">+ New file</button>
          <button class="tool-btn secondary" id="new-folder-btn">+ New folder</button>
          <button class="tool-btn tertiary" id="reset-project-btn">Reset project</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <div class="window-actions">
              <span class="dot red"></span>
              <span class="dot yellow"></span>
              <span class="dot green"></span>
            </div>
            <div class="workspace-name">codecraft-project</div>
          </div>

          <div class="topbar-right">
            <select id="language-select" aria-label="Select programming language">
              <option value="java">Java</option>
              <option value="cpp">C++</option>
              <option value="python">Python</option>
              <option value="javascript">JavaScript</option>
              <option value="typescript">TypeScript</option>
              <option value="html">HTML</option>
              <option value="css">CSS</option>
              <option value="markdown">Markdown</option>
              <option value="json">JSON</option>
            </select>
            <button class="action-btn save-btn" id="save-btn">Save</button>
            <button class="action-btn run-btn" id="run-btn">Run</button>
          </div>
        </header>

        <div class="editor-shell">
          <div class="tab-bar" id="tab-bar"></div>
          <div id="editor-container"></div>
        </div>

        <section class="output-panel">
          <div class="output-header">
            <span>Output</span>
            <button class="clear-btn" id="clear-output-btn">Clear</button>
          </div>
          <pre id="output-console" class="output-console">CodeCraft IDE ready. Choose a file to start editing.</pre>
        </section>
      </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
