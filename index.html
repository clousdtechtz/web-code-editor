<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCraft IDE</title>
    <meta
      name="description"
      content="CodeCraft IDE is a browser-based coding workspace with live preview."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="status-bar">
          <div class="time">21:17</div>
          <div class="status-icons">
            <span class="status-signal">◔</span>
            <span class="status-wifi">◌</span>
            <span class="status-battery">▣</span>
          </div>
        </div>

        <div class="brand-row">
          <div class="logo">C</div>
          <div class="brand-copy">
            <div class="brand-name">CodeCraft</div>
            <div class="brand-sub">IDE</div>
          </div>
        </div>

        <div class="sidebar-section explorer-section">
          <div class="section-label">Explorer</div>
          <div id="project-tree" class="project-tree"></div>
        </div>

        <div class="sidebar-section tools-panel">
          <div class="section-label">Quick tools</div>
          <button class="tool-btn" id="new-file-btn">+ New file</button>
          <button class="tool-btn secondary" id="new-folder-btn">+ New folder</button>
          <button class="tool-btn tertiary" id="reset-project-btn">Reset project</button>
          <button class="tool-btn download-btn" id="download-btn">↓ Download ZIP</button>
        </div>

        <div class="project-toolbar">
          <div class="traffic-lights">
            <span class="light red"></span>
            <span class="light yellow"></span>
            <span class="light green"></span>
          </div>

          <div class="project-name">codecraft-project</div>

          <div class="toolbar-actions">
            <select id="language-select" aria-label="Select programming language">
              <option value="html">HTML</option>
              <option value="javascript">JavaScript</option>
              <option value="css">CSS</option>
              <option value="java">Java</option>
              <option value="cpp">C++</option>
              <option value="python">Python</option>
              <option value="typescript">TypeScript</option>
              <option value="markdown">Markdown</option>
              <option value="json">JSON</option>
            </select>
            <button class="action-btn save-btn" id="save-btn">Save</button>
            <button class="action-btn run-btn" id="run-btn">Run</button>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-left">
            <div class="window-actions">
              <span class="dot red"></span>
              <span class="dot yellow"></span>
              <span class="dot green"></span>
            </div>
            <div class="workspace-name">codecraft-project</div>
          </div>

          <div class="topbar-right">
            <select id="language-select-desktop" aria-label="Select programming language">
              <option value="html">HTML</option>
              <option value="javascript">JavaScript</option>
              <option value="css">CSS</option>
              <option value="java">Java</option>
              <option value="cpp">C++</option>
              <option value="python">Python</option>
              <option value="typescript">TypeScript</option>
              <option value="markdown">Markdown</option>
              <option value="json">JSON</option>
            </select>
            <button class="action-btn save-btn" id="save-btn-desktop">Save</button>
            <button class="action-btn run-btn" id="run-btn-desktop">Run</button>
          </div>
        </header>

        <div class="content-wrapper">
          <div class="editor-section">
            <div class="tab-bar" id="tab-bar"></div>
            <div id="editor-container"></div>
          </div>

          <div class="preview-section">
            <div class="preview-header">
              <span>📱 Live Preview</span>
              <button class="refresh-btn" id="refresh-preview-btn">Refresh</button>
            </div>
            <div class="phone-frame">
              <div class="phone-notch"></div>
              <iframe id="preview-frame" class="preview-iframe" sandbox="allow-scripts"></iframe>
              <div class="phone-bottom"></div>
            </div>
          </div>
        </div>

        <section class="output-panel">
          <div class="output-header">
            <span>Output</span>
            <button class="clear-btn" id="clear-output-btn">Clear</button>
          </div>
          <pre id="output-console" class="output-console">CodeCraft IDE ready. Choose a file to start editing.</pre>
        </section>

        <div class="mobile-toolbar">
          <div class="nav-button back-button">⌃</div>
          <div class="nav-button active">◉</div>
          <div class="nav-button muted">◐</div>
          <div class="nav-button muted">◉</div>
          <div class="nav-button muted">◔</div>
          <div class="nav-button add-button">＋</div>
          <div class="address-bar">
            <span class="url-icon">◌</span>
            <span>cloudstechtz.github.io/web-</span>
            <span class="plus-small">＋</span>
            <span class="count-pill">8</span>
            <span class="more-dots">⋮</span>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
